<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Schnelle, mobile Kassenhilfe für Getränkebestellungen und Pfandrückgabe."
    />
    <title>StuRa Kasse</title>
    <link rel="preconnect" href="https://use.typekit.net" />
    <link rel="stylesheet" href="https://use.typekit.net/ctn1mik.css" />
    <link rel="stylesheet" href="styles.css" />
    <script src="config.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <!-- Ansicht 1: Getränke auswählen -->
      <section class="screen screen--active" id="products-screen" aria-labelledby="products-title">
        <header class="screen__header">
          <div>
            <p class="eyebrow" id="party-name">Kasse</p>
            <h1 id="products-title">Getränkeliste</h1>
          </div>
          <button
            class="text-button"
            id="reset-button"
            type="button"
            aria-label="Aktuelle Getränkeauswahl leeren"
            disabled
          >
            Leeren
          </button>
        </header>

        <div class="product-grid" id="product-grid" aria-label="Getränkeauswahl"></div>

        <footer class="action-bar">
          <div class="running-total" aria-live="polite">
            <span id="item-count">0 Getränke</span>
            <strong id="drink-total">0,00 €</strong>
          </div>
          <button class="primary-button" id="to-deposit-button" type="button" disabled>
            Berechnen...
          </button>
        </footer>
      </section>

      <!-- Ansicht 2: zurückgegebenes Pfand zählen -->
      <section class="screen" id="deposit-screen" aria-labelledby="deposit-title" hidden>
        <header class="screen__header">
          <button class="back-button" data-back-to="products" type="button" aria-label="Zurück zu den Getränken">
            <img class="button-icon" src="assets/icons/back.svg" alt="" aria-hidden="true" />
          </button>
          <div class="header-copy">
            <h1 id="deposit-title">Pfand zurück?</h1>
          </div>
        </header>

        <p class="deposit-explanation">
          Wie viel Stück werden zurückgegeben?
          <span id="deposit-rate">0,00 € Pfand pro Stück</span>
        </p>

        <div class="counter" aria-label="Anzahl zurückgegebener Pfandartikel">
          <button class="counter__button" id="deposit-minus" type="button" aria-label="Ein Pfand weniger" disabled>
            <img class="button-icon" src="assets/icons/remove.svg" alt="" aria-hidden="true" />
          </button>
          <output class="counter__value" id="deposit-count" aria-live="polite">0</output>
          <button class="counter__button" id="deposit-plus" type="button" aria-label="Ein Pfand mehr">
            <img class="button-icon" src="assets/icons/add.svg" alt="" aria-hidden="true" />
          </button>
        </div>

        <footer class="deposit-actions">
          <output class="deposit-running-total" id="deposit-total" aria-live="polite">− 0,00 €</output>
          <button class="primary-button" id="calculate-button" type="button">
            Berechnen ohne Pfand
          </button>
        </footer>
      </section>

      <!-- Ansicht 3: Ergebnis und nachvollziehbarer Kassenbon -->
      <section class="screen" id="receipt-screen" aria-labelledby="receipt-title" hidden>
        <header class="receipt-header">
          <p class="eyebrow" id="receipt-title">Zu zahlen</p>
          <h1 class="grand-total" id="grand-total">0,00 €</h1>
        </header>

        <div class="receipt" aria-label="Zusammenfassung der Bestellung">
          <div class="receipt__heading">
            <strong id="receipt-party-name">Kassenbon</strong>
            <span id="receipt-time"></span>
          </div>
          <div class="receipt__rule"></div>
          <ul class="receipt__items" id="receipt-items"></ul>
          <div class="receipt__rule"></div>
          <div class="receipt__total-row">
            <strong>Gesamt</strong>
            <strong id="receipt-total">0,00 €</strong>
          </div>
        </div>

        <footer class="result-actions">
          <button class="secondary-button" id="edit-button" type="button">Korrigieren</button>
          <button class="primary-button primary-button--wide" id="finish-button" type="button">
            Fertig
          </button>
        </footer>
      </section>
    </main>

    <dialog class="price-dialog" id="price-dialog" aria-labelledby="price-dialog-title" tabindex="-1">
      <form class="price-dialog__form" id="price-form">
        <header class="price-dialog__header">
          <div>
            <p class="eyebrow">Getränk anpassen</p>
            <h2 id="price-dialog-title">Getränk</h2>
          </div>
          <button
            class="price-dialog__close"
            id="price-dialog-close"
            type="button"
            aria-label="Dialog schließen"
          >
            <img class="button-icon" src="assets/icons/close.svg" alt="" aria-hidden="true" />
          </button>
        </header>

        <p class="price-dialog__description">
          Die Werte werden nur auf diesem Gerät gespeichert.
        </p>

        <div class="price-dialog__fields">
          <label class="price-field" for="edit-drink-price">
            <span>Getränkepreis</span>
            <span class="price-field__input">
              <input
                id="edit-drink-price"
                name="drink-price"
                type="text"
                inputmode="decimal"
                pattern="[0-9]+([,.][0-9]{1,2})?"
                title="Betrag mit höchstens zwei Nachkommastellen"
                required
              />
              <span aria-hidden="true">€</span>
            </span>
          </label>

          <label class="price-field" for="edit-drink-deposit">
            <span>Pfand</span>
            <span class="price-field__input">
              <input
                id="edit-drink-deposit"
                name="drink-deposit"
                type="text"
                inputmode="decimal"
                pattern="[0-9]+([,.][0-9]{1,2})?"
                title="Betrag mit höchstens zwei Nachkommastellen"
                required
              />
              <span aria-hidden="true">€</span>
            </span>
          </label>
        </div>

        <p class="price-dialog__default" id="price-dialog-default"></p>

        <footer class="price-dialog__actions">
          <button class="secondary-button" id="price-reset-button" type="button" disabled>
            Zurücksetzen
          </button>
          <button class="primary-button price-dialog__save" type="submit">Speichern</button>
        </footer>

        <button class="price-dialog__reset-all" id="price-reset-all-button" type="button" disabled>
          Alle Werte zurücksetzen
        </button>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

    <noscript>Diese Kassenhilfe benötigt JavaScript.</noscript>
  </body>
</html>
